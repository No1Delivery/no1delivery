<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Customer Demo - 종로 시나리오 👤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .json-viewer { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 12px; height: 450px; overflow: auto; }
        .btn-base { width: 100%; text-align: left; padding: 0.5rem 0.75rem; font-size: 0.75rem; font-weight: bold; border-radius: 0.375rem; border: 1px solid #d1d5db; background-color: white; color: #1f2937; transition: all 0.2s; margin-bottom: 0.5rem; }
        .btn-base:hover { background-color: #f3f4f6; border-color: #9ca3af; }
    </style>
</head>
<body class="bg-indigo-50 p-6">
<div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow-xl border-t-8 border-indigo-600">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-indigo-800">고객 (CUSTOMER) 👤</h1>
        <div class="flex gap-2 text-[10px] font-mono bg-indigo-100 p-2 rounded border border-indigo-200">
            ORDER: <b id="o_id" class="text-indigo-600">None</b> | REVIEW: <b id="rv_id" class="text-orange-600">None</b>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="space-y-1">
            <input id="token" type="text" placeholder="Customer JWT Token" class="w-full border p-2 text-[10px] rounded mb-2 outline-none focus:ring-2 focus:ring-indigo-400">

            <button onclick="fill('LOGIN')" class="btn-base">고객 로그인 🔑</button>
            <button onclick="fill('SEARCH')" class="btn-base">주변 맛집 검색 🔍</button>
            <button onclick="fill('GET_MENUS')" class="btn-base">가게 메뉴판 조회 📋</button>
            <button onclick="fill('GET_MENU_DETAIL')" class="btn-base">메뉴 상세 정보 조회 🔍</button>

            <button onclick="fill('ORDER')" class="btn-base">주문 생성 🛒</button>
            <button onclick="fill('CANCEL_ORDER')" class="btn-base">주문 취소 ❌</button>
<!--            <button onclick="fill('PAY')" class="btn-base">결제 승인 요청 ✅</button>-->

            <button onclick="fill('MY_ORDER')" class="btn-base">내 주문 내역 확인 📋</button>
            <button onclick="fill('REVIEW')" class="btn-base">리뷰 작성 ⭐</button>
            <button onclick="fill('REVIEW_DETAIL')" class="btn-base">리뷰 상세 조회 🔍</button>
        </div>

        <div class="md:col-span-3 space-y-4">
            <div class="flex gap-2 bg-white p-2 border rounded shadow-inner">
                <span id="display-method" class="font-bold text-indigo-600 px-2 border-r uppercase">POST</span>
                <input id="url" type="text" class="flex-1 font-mono text-sm outline-none" placeholder="/v1/...">
                <button onclick="send()" class="bg-indigo-700 text-white px-10 py-1 rounded font-bold hover:bg-indigo-800 transition">SEND</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <textarea id="body" class="p-3 border rounded h-[450px] font-mono text-xs bg-gray-50 outline-none focus:bg-white transition-all" spellcheck="false"></textarea>
                <div class="flex flex-col">
                    <div id="resStatus" class="text-[10px] font-bold mb-1 ml-1 text-gray-400 uppercase">RESPONSE</div>
                    <pre id="res" class="json-viewer italic text-gray-500">API 응답 대기 중...</pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let storage = {
        storeId: "770e8400-e29b-41d4-a716-446655440003",
        menuId: "990e8400-e29b-41d4-a716-446655440010",
        orderId: "",
        reviewId: ""
    };

    const demoData = {
        LOGIN: { m: 'POST', u: '/v1/users/auth/login', b: { loginId: "customer_lee", password: "password" } },
        SEARCH: { m: 'GET', u: '/v1/stores?storeStatus=OPEN&latitude=37.5730&longitude=126.9790&radiusKm=3.0', b: null },
        GET_MENUS: { m: 'GET', u: '/v1/stores/{storeId}/menus', b: null },
        GET_MENU_DETAIL: { m: 'GET', u: '/v1/stores/{storeId}/menus/{menuId}', b: null },
        ORDER: {
            m: 'POST', u: '/v1/orders',
            b: {
                ordererName: "이영희", storeId: "{storeId}", storeName: "경복궁 가마솥 국밥",
                deliveryAddress: "서울특별시 종로구 종로1길 36", deliveryAddressDetail: "종로구청 7층",
                phone: "010-9876-5432",
                items: [{
                    menuId: "{menuId}",
                    menuName: "전통 돼지국밥", quantity: 1, menuPrice: 10000,
                    options: [{ name: "사이즈 선택", subOptions: [{ name: "보통", price: 0 }]}, { name: "추가 선택", subOptions: [{ name: "공기밥 추가", price: 1000 }] }]
                }]
            }
        },
        CANCEL_ORDER: { m: 'PATCH', u: '/v1/orders/{orderId}/cancel', b: { reason: "단순 변심으로 인한 주문 취소" } },
        PAY: { m: 'POST', u: '/v1/payments/confirm', b: { orderId: "{orderId}", paymentKey: "toss_lee_999", amount: 13000 } },
        MY_ORDER: { m: 'GET', u: '/v1/orders/my', b: null },
        REVIEW: { m: 'POST', u: '/v1/reviews', b: { orderId: "{orderId}", storeId: "{storeId}", comment: "수육 퀄리티가 대단하네요!", rating: 5 } },
        REVIEW_DETAIL: { m: 'GET', u: '/v1/reviews/{reviewId}', b: null }
    };

    function fill(key) {
        const data = demoData[key];
        let url = data.u.replace(/{storeId}/g, storage.storeId)
            .replace(/{menuId}/g, storage.menuId)
            .replace(/{orderId}/g, storage.orderId)
            .replace(/{reviewId}/g, storage.reviewId);

        let bodyStr = data.b ? JSON.stringify(data.b, null, 2) : "";
        bodyStr = bodyStr.replace(/{storeId}/g, storage.storeId)
            .replace(/{menuId}/g, storage.menuId)
            .replace(/{orderId}/g, storage.orderId)
            .replace(/{reviewId}/g, storage.reviewId);

        document.getElementById('url').value = url;
        document.getElementById('display-method').innerText = data.m;
        document.getElementById('body').value = bodyStr;
    }

    async function send() {
        const resArea = document.getElementById('res');
        const statusArea = document.getElementById('resStatus');
        const orderIdDisplay = document.getElementById('o_id');
        const reviewIdDisplay = document.getElementById('rv_id');
        resArea.innerText = "Processing...";

        try {
            const method = document.getElementById('display-method').innerText;
            const urlValue = document.getElementById('url').value;
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + document.getElementById('token').value
                }
            };
            if (method !== 'GET') options.body = document.getElementById('body').value;

            const response = await fetch("http://localhost:3000" + urlValue, options);
            const data = await response.json().catch(() => ({}));

            statusArea.innerText = `RESPONSE - STATUS: ${response.status}`;
            resArea.innerText = JSON.stringify(data, null, 2);

            if(data.token) document.getElementById('token').value = data.token;

            // 주문 ID 캡처
            if(urlValue.includes('/orders') && method === 'POST') {
                const newId = data.orderId || data.id || (data.data && data.data.id);
                if(newId) {
                    storage.orderId = newId;
                    orderIdDisplay.innerText = newId.substring(0, 8) + "...";
                }
            }

            // 리뷰 ID 캡처 (순수 문자열 응답 처리)
            if(urlValue.includes('/reviews') && method === 'POST') {
                const newRevId = (typeof data === 'string') ? data : (data.reviewId || data.id);
                if(newRevId) {
                    storage.reviewId = newRevId;
                    reviewIdDisplay.innerText = newRevId.substring(0, 8) + "...";
                }
            }
        } catch(e) {
            resArea.innerText = "Error: " + e.message;
        }
    }
</script>
</body>
</html>
