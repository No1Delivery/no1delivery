<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Owner Demo - 종로 국밥 사장님 👨‍🍳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .json-viewer { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 12px; height: 450px; overflow: auto; }
        .btn-base { width: 100%; text-align: left; padding: 0.5rem 0.75rem; font-size: 0.75rem; font-weight: bold; border-radius: 0.375rem; border: 1px solid #d1d5db; background-color: white; color: #1f2937; transition: all 0.2s; margin-bottom: 0.5rem; }
        .btn-base:hover { background-color: #f3f4f6; border-color: #9ca3af; }
    </style>
</head>
<body class="bg-stone-50 p-6">
<div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow-xl border-t-8 border-green-600">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-green-800">가게 사장(OWNER) 🍳</h1>
        <div class="flex gap-2 text-[10px] font-mono bg-green-50 p-2 rounded border border-green-200">
            STORE: <b id="s_id">770e8...</b> | ORDER: <b id="o_id" class="text-green-600 font-bold">None</b>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="space-y-1">
            <input id="token" type="text" placeholder="Owner JWT Token" class="w-full border p-2 text-[10px] rounded mb-2 outline-none focus:ring-2 focus:ring-green-400">

            <button onclick="fill('LOGIN')" class="btn-base">사장님 로그인 🔑</button>
            <button onclick="fill('GET_STORE')" class="btn-base">내 가게 정보 조회 🏪</button>

            <button onclick="fill('CREATE_MENU')" class="btn-base">신규 메뉴 등록 (수육) 🍶</button>
            <button onclick="fill('GET_MENUS')" class="btn-base">전체 메뉴 목록 조회 📋</button>
            <button onclick="fill('GET_MENU_DETAIL')" class="btn-base">메뉴 상세 정보 확인 🔍</button>
            <button onclick="fill('HIDE_MENU')" class="btn-base">메뉴 상태 변경 (HIDDEN) 🙈</button>

            <button onclick="fill('CHECK_ORDER')" class="btn-base">접수 주문 목록 확인 🔔</button>
            <button onclick="fill('UPDATE_STATUS')" class="btn-base">주문 상태 변경 (조리중) ⚙️</button>
            <button onclick="fill('GET_REVIEWS')" class="btn-base">가게 전체 리뷰 목록 조회 ⭐</button>
        </div>

        <div class="md:col-span-3 space-y-4">
            <div class="flex gap-2 bg-white p-2 border rounded shadow-inner">
                <span id="display-method" class="font-bold text-green-600 px-2 border-r uppercase">POST</span>
                <input id="url" type="text" class="flex-1 font-mono text-sm outline-none" placeholder="/v1/...">
                <button onclick="send()" class="bg-indigo-700 text-white px-10 py-1 rounded font-bold hover:bg-indigo-800 transition">SEND</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <textarea id="body" class="p-3 border rounded h-[450px] font-mono text-xs bg-gray-50 outline-none focus:bg-white transition-all" spellcheck="false"></textarea>
                <div class="flex flex-col">
                    <div id="resStatus" class="text-[10px] font-bold mb-1 ml-1 text-gray-400 uppercase">RESPONSE</div>
                    <pre id="res" class="json-viewer italic text-gray-500">API 응답 대기 중...</pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let storage = {
        storeId: "770e8400-e29b-41d4-a716-446655440003",
        menuId: "990e8400-e29b-41d4-a716-446655440010",
        orderId: ""
    };

    const demoData = {
        LOGIN: { m: 'POST', u: '/v1/users/auth/login', b: { loginId: "owner_pizza", password: "password" } },
        GET_STORE: { m: 'GET', u: '/v1/stores/{storeId}', b: null },
        CREATE_MENU: {
            m: 'POST', u: '/v1/stores/{storeId}/menus',
            b: {
                name: "맛보기 수육",
                description: "부드럽게 삶아낸 국내산 돼지 수육",
                price: 12000,
                options: [{
                    name: "추가 선택",
                    subOptions: [{ name: "쌈채소 추가", addPrice: 1000 }]
                }]
            }
        },
        GET_MENUS: { m: 'GET', u: '/v1/stores/{storeId}/menus', b: null },
        GET_MENU_DETAIL: { m: 'GET', u: '/v1/stores/{storeId}/menus/{menuId}', b: null },

        HIDE_MENU: {
            m: 'PATCH',
            u: '/v1/stores/{storeId}/menus/{menuId}/status?status=HIDDEN',
            b: null
        },

        CHECK_ORDER: { m: 'GET', u: '/v1/orders/store/{storeId}?page=0&size=10', b: null },
        UPDATE_STATUS: { m: 'PATCH', u: '/v1/orders/{orderId}/status?status=PREPARING', b: null },
        GET_REVIEWS: { m: 'GET', u: '/v1/reviews/store/{storeId}?page=0&size=10', b: null }
    };

    function fill(key) {
        const data = demoData[key];
        let url = data.u.replace(/{storeId}/g, storage.storeId)
            .replace(/{menuId}/g, storage.menuId)
            .replace(/{orderId}/g, storage.orderId);

        let bodyStr = data.b ? JSON.stringify(data.b, null, 2) : "";
        bodyStr = bodyStr.replace(/{storeId}/g, storage.storeId)
            .replace(/{menuId}/g, storage.menuId)
            .replace(/{orderId}/g, storage.orderId);

        document.getElementById('url').value = url;
        document.getElementById('display-method').innerText = data.m;
        document.getElementById('body').value = bodyStr;
    }

    async function send() {
        const resArea = document.getElementById('res');
        const statusArea = document.getElementById('resStatus');
        const orderIdDisplay = document.getElementById('o_id');
        resArea.innerText = "Processing...";

        try {
            const method = document.getElementById('display-method').innerText;
            const urlValue = document.getElementById('url').value;
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + document.getElementById('token').value.trim()
                }
            };
            if (method !== 'GET') options.body = document.getElementById('body').value;

            const response = await fetch(urlValue, options);
            const data = await response.json().catch(() => ({}));

            statusArea.innerText = `RESPONSE - STATUS: ${response.status}`;
            resArea.innerText = JSON.stringify(data, null, 2);

            if(data.token) document.getElementById('token').value = data.token;

            if (data.content && data.content[0]) {
                const newId = data.content[0].orderId || data.content[0].id;
                if (newId) {
                    storage.orderId = newId;
                    orderIdDisplay.innerText = newId.substring(0, 8) + "...";
                }
            }
        } catch(e) {
            resArea.innerText = "Error: " + e.message;
        }
    }
</script>
</body>
</html>
