<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Manager Demo - 운영 매니저 🛡️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .json-viewer { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 12px; height: 450px; overflow: auto; }
        .btn-base { width: 100%; text-align: left; padding: 0.5rem 0.75rem; font-size: 0.75rem; font-weight: bold; border-radius: 0.375rem; border: 1px solid #d1d5db; background-color: white; color: #1f2937; transition: all 0.2s; margin-bottom: 0.5rem; }
        .btn-base:hover { background-color: #f3f4f6; border-color: #9ca3af; }
    </style>
</head>
<body class="bg-slate-100 p-6">
<div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow-xl border-t-8 border-slate-600">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800">관리자(MANAGER) 🛡️</h1>
        <div class="flex gap-2 text-[10px] font-mono bg-slate-100 p-2 rounded border border-slate-200">
            ROLE: <b class="text-slate-600">MANAGER</b> | ID: <b>manager_01</b>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="space-y-1">
            <input id="token" type="text" placeholder="Manager JWT Token" class="w-full border p-2 text-[10px] rounded mb-2 outline-none focus:ring-2 focus:ring-slate-400">

            <button onclick="fill('LOGIN')" class="btn-base">매니저 로그인 🔑</button>
            <button onclick="fill('GET_STORES')" class="btn-base">전체 가게 목록 조회 🏪</button>
            <button onclick="fill('GET_ORDERS')" class="btn-base">전체 주문 목록 조회 📋</button>
        </div>

        <div class="md:col-span-3 space-y-4">
            <div class="flex gap-2 bg-white p-2 border rounded shadow-inner">
                <span id="display-method" class="font-bold text-slate-600 px-2 border-r uppercase">POST</span>
                <input id="url" type="text" class="flex-1 font-mono text-sm outline-none" placeholder="/v1/...">
                <button onclick="send()" class="bg-slate-700 text-white px-10 py-1 rounded font-bold hover:bg-slate-800 transition">SEND</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <textarea id="body" class="p-3 border rounded h-[450px] font-mono text-xs bg-gray-50 outline-none focus:bg-white transition-all" spellcheck="false"></textarea>
                <div class="flex flex-col">
                    <div id="resStatus" class="text-[10px] font-bold mb-1 ml-1 text-gray-400 uppercase">RESPONSE</div>
                    <pre id="res" class="json-viewer italic text-gray-500">API 응답 대기 중...</pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const demoData = {
        LOGIN: {
            m: 'POST',
            u: '/v1/users/auth/login',
            b: { loginId: "manager_01", password: "password" }
        },
        GET_STORES: {
            m: 'GET',
            u: '/v1/stores?page=0&size=20',
            b: null
        },
        GET_ORDERS: {
            m: 'GET',
            u: '/v1/orders?page=0&size=20',
            b: null
        }
    };

    function fill(key) {
        const data = demoData[key];
        document.getElementById('url').value = data.u;
        document.getElementById('display-method').innerText = data.m;
        document.getElementById('body').value = data.b ? JSON.stringify(data.b, null, 2) : "";
    }

    async function send() {
        const resArea = document.getElementById('res');
        const statusArea = document.getElementById('resStatus');
        resArea.innerText = "Processing...";

        try {
            const method = document.getElementById('display-method').innerText;
            const urlValue = document.getElementById('url').value;
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + document.getElementById('token').value.trim()
                }
            };
            if (method !== 'GET') options.body = document.getElementById('body').value;

            const response = await fetch(urlValue, options);
            const data = await response.json().catch(() => ({}));

            statusArea.innerText = `RESPONSE - STATUS: ${response.status}`;
            resArea.innerText = JSON.stringify(data, null, 2);

            if(data.token) document.getElementById('token').value = data.token;
        } catch(e) {
            resArea.innerText = "Error: " + e.message;
        }
    }
</script>
</body>
</html>
